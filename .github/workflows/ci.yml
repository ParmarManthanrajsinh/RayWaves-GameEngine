name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            check: powershell -ExecutionPolicy Bypass -File scripts/check.ps1
            smoke: powershell -ExecutionPolicy Bypass -File scripts/agent-smoke.ps1
          - name: Linux
            os: ubuntu-24.04
            check: ./scripts/check.sh
            smoke: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a ./scripts/agent-smoke.sh

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgl1-mesa-dri libasound2-dev \
            xvfb zenity
          # Optional; check.sh skips the format gate when it is unavailable.
          sudo apt-get install -y clang-format || true

      - name: Cache pinned toolchain
        uses: actions/cache@v4
        with:
          path: |
            Tools/zig
            Tools/cmake
            Tools/ninja
          key: raywaves-toolchain-${{ runner.os }}-${{ hashFiles('Tools/toolchain.ini') }}

      - name: Check (format + docs + tests)
        run: ${{ matrix.check }}

      - name: 200-cycle hot reload
        if: runner.os == 'Linux'
        working-directory: build/zig-debug
        run: ./raywaves_smoke --iterations 200

      - name: 200-cycle hot reload
        if: runner.os == 'Windows'
        working-directory: build/zig-debug
        run: ./raywaves_smoke.exe --iterations 200

      - name: Agent smoke test
        run: ${{ matrix.smoke }}

  # Linux-only ASan/UBSan gate. Windows builds force -fno-sanitize=all in
  # cmake/Platform.cmake, so a Windows sanitizer job would be a no-op.
  sanitize:
    name: Linux sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgl1-mesa-dri libasound2-dev \
            xvfb

      - name: Configure sanitizer build
        run: |
          cmake -S . -B build/asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DRAYWAVES_TOOLCHAIN=system \
            -DRAYWAVES_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build unit and integration test targets
        run: cmake --build build/asan --target raywaves_tests_unit raywaves_tests_integration

      - name: Run unit and integration tests under ASan + UBSan
        env:
          # Leak checking stays off: raylib/X11/GL teardown and forked children
          # produce allocator noise that is not ours to fix.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a ctest --test-dir build/asan -L "unit|integration" \
            --no-tests=error --output-on-failure

  package:
    name: Package (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ${{ matrix.os }}
    env:
      # Release artifacts must not silently raise the documented glibc floor.
      RAYWAVES_ENFORCE_GLIBC: "1"
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
            command: powershell -ExecutionPolicy Bypass -File scripts/package.ps1 -IncludeCompiler -Zip
            artifact: dist/*.zip
          - name: Linux
            os: ubuntu-24.04
            command: ./scripts/package.sh --archive
            artifact: |
              dist/*.tar.gz
              dist/*.sha256

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev

      - name: Build package
        run: ${{ matrix.command }}

      - name: Verify packaged Linux archive
        if: runner.os == 'Linux'
        run: |
          rm -rf /tmp/raywaves-package-check
          mkdir -p /tmp/raywaves-package-check
          tar -xzf dist/*.tar.gz -C /tmp/raywaves-package-check
          /tmp/raywaves-package-check/rwcli --version
          ! ldd /tmp/raywaves-package-check/RayWaves | grep 'not found'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: raywaves-${{ matrix.name }}
          path: ${{ matrix.artifact }}
